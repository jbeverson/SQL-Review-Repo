name: R tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true        # prebuilt binary packages, much faster

      - name: Install packages
        run: |
          install.packages(c("testthat", "dplyr", "tidyr", "tibble", "readr"))
        shell: Rscript {0}

      - name: Run tests
        run: |
          testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}